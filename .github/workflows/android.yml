name: Android Build

on:
  push:
    branches: [tune-glass-insights]
  pull_request:
    branches: [tune-glass-insights]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules at pinned revisions
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: gradle
    - name: Install required Android NDK
      run: |
        set -eu
        SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager was not found under ${ANDROID_HOME}/cmdline-tools" >&2
          exit 1
        fi
        echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
        yes | "$SDKMANAGER" --licenses >/dev/null
        "$SDKMANAGER" --install "ndk;28.2.13676358"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build debug APK with Gradle
      run: ./gradlew app:packageDebug
    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Canary
        path: ./app/build/outputs/apk/debug/app-debug.apk
