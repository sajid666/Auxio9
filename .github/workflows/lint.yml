name: Android Lint

on:
  push:
    branches: [tune-glass-insights]
  pull_request:
    branches: [tune-glass-insights]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules at pinned revisions
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check Kotlin formatting
      run: ./gradlew spotlessCheck
    - name: Run unit tests
      run: ./gradlew musikr:testDebug app:testDebugUnitTest
    - name: Run Android lint
      run: ./gradlew lintDebug

    - name: Print full Android lint report
      if: always()
      shell: bash
      run: |
        report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
        if [[ -f "$report" ]]; then
          cat "$report"
        else
          echo "Android lint text report was not generated at $report"
          find app/build -type f -iname '*lint*results*' -print 2>/dev/null || true
        fi
