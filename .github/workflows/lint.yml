name: Android Lint

on:
  push:
    branches: [tune-glass-insights]
  pull_request:
    branches: [tune-glass-insights]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install ninja-build
      run: sudo apt-get install -y ninja-build
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Clone submodules at pinned revisions
      run: git submodule update --init --recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: TEMP export formatter output for changed Kotlin files
      run: |
        set -eu
        ./gradlew spotlessApply
        git diff --name-only -- '*.kt' > /tmp/formatted-kotlin-files.txt
        while IFS= read -r file; do
          [ -n "$file" ] || continue
          echo "AUXIO_FILE_BEGIN:$file"
          base64 -w0 "$file"
          echo
          echo "AUXIO_FILE_END:$file"
        done < /tmp/formatted-kotlin-files.txt
    - name: Check Kotlin formatting
      run: ./gradlew spotlessCheck
    - name: Run unit tests
      run: ./gradlew musikr:testDebug app:testDebugUnitTest
    - name: Run Android lint
      run: ./gradlew lintDebug
